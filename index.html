<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Platter</title>
    <!-- Font awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Sora Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-[Sora]">
    <header class="bg-[#faf9f7]">
      <nav class="flex justify-between items-center px-24 py-5" >
        <img src="./assets/nav-logo.png" alt="" class="w-28 h-auto" />
        <ul class="flex justify-center gap-4 items-center pl-40">
          <li><a href="#">Product</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
        <div class="flex items-center gap-2.5">
          <span class="pr-1"><i class="fa-brands fa-sistrix"></i></span>
          <span class="pr-3"><i class="fa-solid fa-basket-shopping"></i></span>
          <button
            class="rounded-lg text-black px-4 py-2 font-normal border border-[#179800] cursor-pointer"
          >
            Login
          </button>
          <button
            class="rounded-lg cursor-pointer bg-[#179800] text-white border-none px-7 py-2"
          >
            Register
          </button>
        </div>
      </nav>

      <!-- Hero Section -->
      <section>
        <div class="text-center">
          <h2 class="font-semibold text-[42px]/13 pt-2">Freshness <span class="text-[#179800]">You Can <br>Count</span> On, Prices You’ll Love!</h2>
        <p class="text-[15px] pt-5 pb-5">
          Shop your daily essentials at unbeatable prices. From fresh produce to
          pantry <br> staples, we’ve got you covered every day!
        </p>
        </div>
        <img src="./assets/Hero Section 1.png" alt="" class="mx-auto max-w-[830px] ">
      </section>
    </header> 
  </body>
</html>
